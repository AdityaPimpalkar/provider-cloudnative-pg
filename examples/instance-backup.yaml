# Instance with Barman Cloud backups, a daily schedule, and PITR (WAL archiving).
#
# Prerequisites:
#   1. OpenEverest + this provider installed (BackupClass cnpg-barman-plugin)
#   2. examples/backup-storage.yaml applied in the same namespace
#
# CNPG allows one backup storage per Instance. Time retention (e.g. 30d) is
# delegated to Barman for the whole archive; count retention is rejected.
# See README "Backup retention and deletion".
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: my-database
spec:
  providerRef:
    name: provider-cloudnative-pg
  version: "18.6"
  components:
    engine:
      type: postgresql
      replicas: 3
      resources:
        requests:
          cpu: "1"
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 1Gi
      storage:
        size: 5Gi
  backup:
    enabled: true
    classRef:
      name: cnpg-barman-plugin
    storages:
      - storageRef:
          name: my-s3-backups
        pitr:
          enabled: true
        schedules:
          - name: daily
            enabled: true
            cron: "0 2 * * *"
            retention:
              type: time
              duration: 30d
