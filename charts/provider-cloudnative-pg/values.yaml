# Default values for provider-cloudnative-pg.

# -- Number of replicas for the provider deployment
replicaCount: 1

image:
  # -- Container image repository
  repository: ghcr.io/adityapimpalkar/provider-cloudnative-pg
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion
  tag: "0.3.3"

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the name of the chart
nameOverride: ""
# -- Override the full name of the chart
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- Automount API credentials for the service account
  automountServiceAccountToken: true
  # -- The name of the service account to use. If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  # -- Specifies whether RBAC resources should be created
  create: true

# -- Annotations to add to the deployment pods
podAnnotations: {}

# -- Labels to add to the deployment pods
podLabels: {}

podSecurityContext:
  # -- Run as non-root
  runAsNonRoot: true
  # -- Security context fsGroup
  fsGroup: 65534

securityContext:
  # -- Disallow privilege escalation
  allowPrivilegeEscalation: false
  # -- Drop all capabilities
  capabilities:
    drop:
      - ALL
  # -- Read-only root filesystem
  readOnlyRootFilesystem: true
  # -- Run as non-root user
  runAsNonRoot: true
  # -- Run as user ID
  runAsUser: 65534

service:
  # -- Service type
  type: ClusterIP
  # -- Service port for the HTTP server (schema/validation endpoints)
  port: 8082

# -- Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

provider:
  # -- The name to register for the Provider custom resource
  name: provider-cloudnative-pg

# Images of the first-class image-volume extensions (PostgreSQL 18+), as a
# CloudNativePG ClusterImageCatalog. The provider copies the entry of each
# enabled extension into the Cluster, so images can be bumped or mirrored here
# without upgrading the provider; changing one restarts the instances using it.
extensionCatalog:
  # -- Render the ClusterImageCatalog; set to false to manage it yourself
  create: true
  # -- Name of the ClusterImageCatalog the provider reads
  name: provider-cloudnative-pg-extensions
  # -- Entries per PostgreSQL major. `image` is required by CloudNativePG but
  # unused: the provider picks the PostgreSQL image from the Instance version.
  # Extension entries are CloudNativePG ExtensionConfigurations plus
  # `sqlVersion`, the CREATE EXTENSION version (empty for the image default).
  images:
    # Trixie builds from the upstream catalog
    # image-catalogs-extensions/catalog-minimal-trixie.yaml in
    # https://github.com/cloudnative-pg/artifacts; AGE and TimescaleDB
    # Community from https://github.com/solanicaio/postgresql-extensions.
    - major: 18
      image: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie
      extensions:
        - name: timescaledb-oss
          sqlVersion: "2.30.1"
          image:
            reference: ghcr.io/cloudnative-pg/timescaledb-oss:2.30.1-18-trixie
        # Timescale License (TSL) components: internal use only, or with a
        # license from Timescale. Needs PostgreSQL 18.6+.
        - name: timescaledb
          sqlVersion: "2.31.0"
          image:
            reference: ghcr.io/solanicaio/timescaledb:2.31.0-202610210913-18-trixie@sha256:27f856054ab4cc274a44b59114bb9574e0b96ab5ebd7063b67ba146dd1efba62
        - name: postgis
          sqlVersion: "3.6.4"
          image:
            reference: ghcr.io/cloudnative-pg/postgis-extension:3.6.4-202610110422-18-trixie@sha256:84a8e286d79aaec6fe824a792179d11252745a0d2b139d88692424fa61494df0
          ld_library_path:
            - system
          env:
            - name: GDAL_DATA
              value: ${image_root}/share/gdal
            - name: PROJ_DATA
              value: ${image_root}/share/proj
        - name: pgrouting
          sqlVersion: "4.0.1"
          image:
            reference: ghcr.io/cloudnative-pg/pgrouting:4.0.1-202610110422-18-trixie@sha256:a9e9f2b786c213bebcb3baffe09d04de844c16bf8420c7bdbd98122c2aa704a1
        - name: pg-ivm
          sqlVersion: "1.15"
          image:
            reference: ghcr.io/cloudnative-pg/pg-ivm:1.15-202610110422-18-trixie@sha256:3f6d327ec3f8cdc4212789f0cfc95be81b723e51f869639d526de6236ecae874
        - name: wal2json
          image:
            reference: ghcr.io/cloudnative-pg/wal2json:2.6-202610110422-18-trixie@sha256:298e20b7e9a75553a7b0070237ff09af9122d5cae2689255c8203283aaf430d0
        - name: age
          sqlVersion: "1.8.0"
          image:
            reference: ghcr.io/solanicaio/age:1.8.0-202610141050-18-trixie@sha256:2fb13aed71690dc127fb8ecb0eb1145c2acf8d4fe8fe25467818f484570f3601

# -- Additional environment variables to set on the provider container
extraEnv: []
# - name: MY_VAR
#   value: "my-value"

# -- Additional volume mounts to add to the provider container
extraVolumeMounts: []

# -- Additional volumes to add to the pod
extraVolumes: []

# -- Leader election configuration
leaderElection:
  # -- Enable leader election (recommended for HA deployments)
  enabled: true

cloudnative-pg:
  # -- Install the CloudNativePG operator as a chart dependency
  enabled: true
  fullnameOverride: cnpg-operator
  crds:
    create: true

# CNPG-I Barman Cloud Plugin — WAL archiving and base backups.
# Installs into the same namespace as this release. Requires a cluster-wide
# cert-manager (not bundled: it is shared cluster infrastructure).
plugin-barman-cloud:
  # -- Install the Barman Cloud Plugin as a chart dependency
  enabled: true
  crds:
    create: true
