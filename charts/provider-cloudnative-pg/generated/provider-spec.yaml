              fieldParams:
                defaultValue: false
                helperText: Keeps logical replication slots (change data capture) in sync on the standbys, so consumers continue from their position after a failover. PostgreSQL 17+; turns on hot_standby_feedback and sync_replication_slots. Create slots with failover enabled, e.g. CREATE SUBSCRIPTION ... WITH (failover = true); a slot is protected once the standby shows it synced and not temporary.
                label: Logical replication slot failover
              path: spec.components.engine.parameters.replicationSlots.highAvailability.synchronizeLogicalDecoding
              uiType: toggle
              validation:
                celExpressions:
                  - celExpr: '!(has(spec.components.engine.parameters.replicationSlots.highAvailability.synchronizeLogicalDecoding) && spec.components.engine.parameters.replicationSlots.highAvailability.synchronizeLogicalDecoding) || spec.version >= "17."'
                    message: Logical replication slot failover requires PostgreSQL 17 or later.
            nodes:
              components:
                numberOfnodes:
                  fieldParams:
                    defaultValue: 3
                    label: Number of nodes
                  path: spec.components.engine.replicas
                  uiType: number
                  validation:
                    celExpressions:
                      - celExpr: '!has(spec.components.engine.parameters.postgresql.synchronous.number) || spec.components.engine.replicas > spec.components.engine.parameters.postgresql.synchronous.number'
                        message: Keep more nodes than synchronous standbys, or lower the synchronous standbys first
                    int: true
                    min: 1
                    modes:
                      edit:
                        celExpressions:
                          - celExpr: '!(spec.components.engine.replicas == 1 && original.spec.components.engine.replicas > 1)'
