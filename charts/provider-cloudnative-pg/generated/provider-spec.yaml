                      - celExpr: '!(has(spec.components.engine.parameters.bootstrap.initdb.database) && spec.components.engine.parameters.bootstrap.initdb.database != "") || (has(spec.components.engine.parameters.bootstrap.initdb.owner) && spec.components.engine.parameters.bootstrap.initdb.owner != "")'
