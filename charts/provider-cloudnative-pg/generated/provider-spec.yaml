                helperText: Rejects unencrypted connections. Clients must connect with TLS; libpq's default sslmode=prefer does, sslmode=disable is refused. Applied without a restart.
                label: Require TLS for client connections
              path: spec.components.engine.parameters.requireTLS
              uiType: toggle
            storageClass:
              dataSource:
                provider: storageClasses
              fieldParams:
                label: Storage class
                modes:
                  edit:
                    disabled: true
                  restore:
                    disabled: true
              path: spec.components.engine.storage.storageClass
              uiType: select
              validation:
                required: true
          componentsOrder:
            - storageClass
            - priorityClassName
            - requireTLS
            - configuration
          description: Configure advanced settings for your database
          label: Advanced configuration
        bootstrap:
          components:
            initdb:
              components:
                credentialsSecret:
                  fieldParams:
                    description: Optional. Name of a Secret containing username and password keys. If empty, CloudNativePG creates one automatically.
                    label: Credentials secret
                    modes:
                      edit:
                        disabled: true
                      restore:
                        disabled: true
                  path: spec.components.engine.parameters.bootstrap.initdb.secret.name
                  uiType: text
                database:
                  fieldParams:
                    label: Database name
                    modes:
                      edit:
                        disabled: true
                      restore:
                        disabled: true
                    placeholder: app
                  path: spec.components.engine.parameters.bootstrap.initdb.database
                  uiType: text
                  validation:
                    modes:
                      edit:
                        celExpressions:
                          - celExpr: spec.components.engine.parameters.bootstrap.initdb.database == original.spec.components.engine.parameters.bootstrap.initdb.database
                            message: Database name cannot be changed after creation
                    regex:
                      message: Must be a valid PostgreSQL identifier (letters, numbers, underscores; cannot start with a number)
                      pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
                owner:
                  fieldParams:
                    label: Database owner
                    modes:
                      edit:
                        disabled: true
                      restore:
                        disabled: true
                    placeholder: app
                  path: spec.components.engine.parameters.bootstrap.initdb.owner
                  uiType: text
                  validation:
                    regex:
                      message: Must be a valid PostgreSQL identifier (letters, numbers, underscores; cannot start with a number)
                      pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
              componentsOrder:
                - database
                - owner
                - credentialsSecret
              uiType: group
          description: 'Configure the application database created when the cluster is first provisioned. Leave empty to use CloudNativePG defaults (database and owner: app).'
          label: Bootstrap initial database
        databaseVersion:
          components:
            version:
              fieldParams:
                label: Database version
                modes:
                  edit:
                    disabled: true
                  restore:
                    disabled: true
                optionsPath: spec.versions
                optionsPathConfig:
                  labelPath: name
                  valuePath: name
              path: spec.version
              uiType: select
              validation:
                required: true
          description: Provide the information about the database version you want to use.
          label: Database version
        extensions:
          components:
            age:
              fieldParams:
                defaultValue: false
                helperText: Graph database with openCypher queries. PostgreSQL 18 only; can only be enabled at creation and cannot be disabled. Run SET search_path = ag_catalog, "$user", public before using it.
                label: Apache AGE
                modes:
                  edit:
                    disabled: true
                  restore:
                    disabled: true
              path: spec.components.engine.parameters.extensions.age.enabled
              uiType: toggle
              validation:
                celExpressions:
                  - celExpr: '!(has(spec.components.engine.parameters.extensions.age.enabled) && spec.components.engine.parameters.extensions.age.enabled) || (spec.version >= "18." && spec.version < "19.")'
                    message: Apache AGE requires PostgreSQL 18. Select a 18.x database version to enable it.
            pgaudit:
              fieldParams:
                defaultValue: false
                helperText: Audit logging of DDL and role changes (pgaudit.log = 'ddl, role'); set pgaudit.* PostgreSQL parameters to change it. Restarts the instances.
                label: pgAudit
              path: spec.components.engine.parameters.extensions.pgaudit.enabled
              uiType: toggle
            pgivm:
              fieldParams:
                defaultValue: false
                helperText: Incrementally maintained materialized views. PostgreSQL 18 only; preloaded, so only at creation (CloudNativePG advises against adding an extension image and a preload library in one rollout); cannot be disabled.
                label: pg_ivm
                modes:
                  edit:
                    disabled: true
                  restore:
                    disabled: true
              path: spec.components.engine.parameters.extensions.pgivm.enabled
              uiType: toggle
              validation:
                celExpressions:
                  - celExpr: '!(has(spec.components.engine.parameters.extensions.pgivm.enabled) && spec.components.engine.parameters.extensions.pgivm.enabled) || (spec.version >= "18." && spec.version < "19.")'
                    message: pg_ivm requires PostgreSQL 18. Select a 18.x database version to enable it.
            pgrouting:
              fieldParams:
                defaultValue: false
                helperText: Routing on PostGIS geometries. PostgreSQL 18 only; requires PostGIS; enabling it restarts the instances; cannot be disabled once enabled.
                label: pgRouting
                modes:
                  restore:
                    disabled: true
              path: spec.components.engine.parameters.extensions.pgrouting.enabled
              uiType: toggle
              validation:
                celExpressions:
                  - celExpr: '!(has(spec.components.engine.parameters.extensions.pgrouting.enabled) && spec.components.engine.parameters.extensions.pgrouting.enabled) || (spec.version >= "18." && spec.version < "19.")'
                    message: pgRouting requires PostgreSQL 18. Select a 18.x database version to enable it.
                  - celExpr: '!(has(spec.components.engine.parameters.extensions.pgrouting.enabled) && spec.components.engine.parameters.extensions.pgrouting.enabled) || (has(spec.components.engine.parameters.extensions.postgis.enabled) && spec.components.engine.parameters.extensions.postgis.enabled)'
                    message: pgRouting requires PostGIS. Enable PostGIS too.
                modes:
                  edit:
                    celExpressions:
                      - celExpr: '!(has(original.spec.components.engine.parameters.extensions.pgrouting.enabled) && original.spec.components.engine.parameters.extensions.pgrouting.enabled) || (has(spec.components.engine.parameters.extensions.pgrouting.enabled) && spec.components.engine.parameters.extensions.pgrouting.enabled)'
                        message: pgRouting cannot be disabled once enabled
            pgvector:
              fieldParams:
                defaultValue: false
                helperText: Vector similarity search. Installed in the application database; cannot be disabled once enabled.
                label: pgvector
              path: spec.components.engine.parameters.extensions.pgvector.enabled
              uiType: toggle
              validation:
                modes:
                  edit:
                    celExpressions:
                      - celExpr: '!(has(original.spec.components.engine.parameters.extensions.pgvector.enabled) && original.spec.components.engine.parameters.extensions.pgvector.enabled) || (has(spec.components.engine.parameters.extensions.pgvector.enabled) && spec.components.engine.parameters.extensions.pgvector.enabled)'
                        message: pgvector cannot be disabled once enabled
            postgis:
              fieldParams:
                defaultValue: false
                helperText: Spatial types and functions. PostgreSQL 18 only; enabling it restarts the instances; cannot be disabled once enabled.
                label: PostGIS
                modes:
                  restore:
                    disabled: true
              path: spec.components.engine.parameters.extensions.postgis.enabled
              uiType: toggle
              validation:
                celExpressions:
                  - celExpr: '!(has(spec.components.engine.parameters.extensions.postgis.enabled) && spec.components.engine.parameters.extensions.postgis.enabled) || (spec.version >= "18." && spec.version < "19.")'
                    message: PostGIS requires PostgreSQL 18. Select a 18.x database version to enable it.
                modes:
                  edit:
                    celExpressions:
                      - celExpr: '!(has(original.spec.components.engine.parameters.extensions.postgis.enabled) && original.spec.components.engine.parameters.extensions.postgis.enabled) || (has(spec.components.engine.parameters.extensions.postgis.enabled) && spec.components.engine.parameters.extensions.postgis.enabled)'
                        message: PostGIS cannot be disabled once enabled
            timescaledb:
              fieldParams:
                defaultValue: false
                helperText: Time-series hypertables. PostgreSQL 18 only; preloaded, so only at creation (CloudNativePG advises against adding an extension image and a preload library in one rollout); cannot be disabled.
                label: TimescaleDB (Apache-2.0)
                modes:
                  edit:
                    disabled: true
                  restore:
                    disabled: true
              path: spec.components.engine.parameters.extensions.timescaledb.enabled
              uiType: toggle
              validation:
                celExpressions:
                  - celExpr: '!(has(spec.components.engine.parameters.extensions.timescaledb.enabled) && spec.components.engine.parameters.extensions.timescaledb.enabled) || (spec.version >= "18." && spec.version < "19.")'
                    message: TimescaleDB requires PostgreSQL 18. Select a 18.x database version to enable it.
            wal2json:
              fieldParams:
                defaultValue: false
                helperText: JSON output plugin for logical decoding (change data capture). PostgreSQL 18 only; enabling or disabling it restarts the instances; drop the replication slots that use it before disabling.
                label: wal2json
                modes:
                  restore:
                    disabled: true
              path: spec.components.engine.parameters.extensions.wal2json.enabled
              uiType: toggle
              validation:
                celExpressions:
                  - celExpr: '!(has(spec.components.engine.parameters.extensions.wal2json.enabled) && spec.components.engine.parameters.extensions.wal2json.enabled) || (spec.version >= "18." && spec.version < "19.")'
                    message: wal2json requires PostgreSQL 18. Select a 18.x database version to enable it.
          componentsOrder:
            - pgvector
            - pgaudit
            - timescaledb
            - postgis
            - pgrouting
            - pgivm
            - wal2json
            - age
          description: Optional PostgreSQL extensions to install and enable on this instance.
          label: Extensions
        monitoring:
          components:
            prometheus:
              fieldParams:
                defaultValue: false
                helperText: Creates a PodMonitor that scrapes the CloudNativePG metrics exporter. Requires the Prometheus Operator.
                label: Prometheus
              path: spec.topology.parameters.monitoring.prometheus.enabled
              uiType: toggle
          description: Collect PostgreSQL metrics with Prometheus.
          label: Monitoring
        resources:
          components:
            nodes:
              components:
                numberOfnodes:
                  fieldParams:
                    defaultValue: 3
                    label: Number of nodes
                  path: spec.components.engine.replicas
                  uiType: number
                  validation:
                    celExpressions:
                      - celExpr: '!has(spec.components.engine.parameters.postgresql.synchronous.number) || spec.components.engine.replicas > spec.components.engine.parameters.postgresql.synchronous.number'
                        message: Keep more nodes than synchronous standbys, or lower the synchronous standbys first
                    int: true
                    min: 1
                    modes:
                      edit:
                        celExpressions:
                          - celExpr: '!(spec.components.engine.replicas == 1 && original.spec.components.engine.replicas > 1)'
                            message: Cannot scale down to a single node
                    required: true
                resources-limits:
                  components:
                    cpu-limits:
                      fieldParams:
                        defaultValue: "1"
                        label: CPU limits
                        placeholder: e.g. 0.5 or 500m
                      path: spec.components.engine.resources.limits.cpu
                      uiType: text
                      validation:
                        regex:
                          message: Enter cores (e.g. 0.5, 2) or millicores (e.g. 500m), greater than zero
                          pattern: ^([1-9][0-9]*(\.[0-9]{1,3})?|0?\.([1-9][0-9]{0,2}|0[1-9][0-9]?|00[1-9])|[1-9][0-9]*m)$
                        required: true
                    cpu-requests:
                      fieldParams:
                        defaultValue: "1"
                        label: CPU requests
                        placeholder: e.g. 0.5 or 500m
                      path: spec.components.engine.resources.requests.cpu
                      uiType: text
                      validation:
                        regex:
                          message: Enter cores (e.g. 0.5, 2) or millicores (e.g. 500m), greater than zero
                          pattern: ^([1-9][0-9]*(\.[0-9]{1,3})?|0?\.([1-9][0-9]{0,2}|0[1-9][0-9]?|00[1-9])|[1-9][0-9]*m)$
                        required: true
                    disk:
                      fieldParams:
                        badge: Gi
                        badgeToApi: true
                        defaultValue: 25
                        label: Disk
                      path: spec.components.engine.storage.size
                      uiType: number
                      validation:
                        int: true
                        min: 1
                        modes:
                          edit:
                            celExpressions:
                              - celExpr: spec.components.engine.storage.size >= original.spec.components.engine.storage.size
                                message: Disk size cannot be decreased
                              - celExpr: '!has(original.spec.components.engine.parameters.walStorage.size) || has(spec.components.engine.parameters.walStorage.size)'
                                message: Separate WAL storage cannot be disabled once configured
                        required: true
                    memory-limits:
                      fieldParams:
                        badge: Gi
                        badgeToApi: true
                        defaultValue: 4
                        label: Memory limits
                        step: 0.1
                      path: spec.components.engine.resources.limits.memory
                      uiType: number
                      validation:
                        min: 0.1
                        required: true
                    memory-requests:
                      fieldParams:
                        badge: Gi
                        badgeToApi: true
                        defaultValue: 4
                        label: Memory requests
                        step: 0.1
                      path: spec.components.engine.resources.requests.memory
                      uiType: number
                      validation:
                        min: 0.1
                        required: true
                  componentsOrder:
                    - cpu-requests
                    - cpu-limits
                    - memory-requests
                    - memory-limits
                    - disk
                  groupType: line
                  uiType: group
              componentsOrder:
                - numberOfnodes
                - resources-limits
              uiType: group
            synchronousReplication:
              components:
                dataDurability:
                  fieldParams:
                    defaultValue: required
                    helperText: Stop writes keeps the durability guarantee. Fall back keeps accepting writes asynchronously until standbys return.
                    label: When too few standbys are available
                    options:
                      - label: Stop writes
                        value: required
                      - label: Fall back to asynchronous
                        value: preferred
                  path: spec.components.engine.parameters.postgresql.synchronous.dataDurability
                  uiType: select
                  validation:
                    required: true
                method:
                  fieldParams:
                    defaultValue: any
                    label: Standby selection
                    options:
                      - label: Any standbys (quorum)
                        value: any
                      - label: First standbys (priority)
                        value: first
                  path: spec.components.engine.parameters.postgresql.synchronous.method
                  uiType: select
                  validation:
                    required: true
                number:
                  fieldParams:
                    defaultValue: 1
                    helperText: How many standbys must confirm each commit.
                    label: Synchronous standbys
                  path: spec.components.engine.parameters.postgresql.synchronous.number
                  uiType: number
                  validation:
                    celExpressions:
                      - celExpr: spec.components.engine.parameters.postgresql.synchronous.number < spec.components.engine.replicas
                        message: Must be lower than the number of nodes
                    int: true
                    min: 1
                    required: true
              componentsOrder:
                - number
                - method
                - dataDurability
              description: Commit only after standbys flush the WAL to durable storage. Off means asynchronous replication. Needs at least two nodes.
              groupType: toggleable
              label: Synchronous replication
              uiType: group
            walStorage:
              components:
                size:
                  fieldParams:
                    badge: Gi
                    badgeToApi: true
                    helperText: The WAL disk cannot be shrunk. Growing it requires an expandable StorageClass.
                    label: WAL disk size
                  path: spec.components.engine.parameters.walStorage.size
                  uiType: number
                  validation:
                    int: true
                    min: 1
                    modes:
                      edit:
                        celExpressions:
                          - celExpr: '!has(original.spec.components.engine.parameters.walStorage.size) || spec.components.engine.parameters.walStorage.size >= original.spec.components.engine.parameters.walStorage.size'
                            message: WAL disk size cannot be decreased
                    required: true
                storageClass:
                  dataSource:
                    provider: storageClasses
                  fieldParams:
                    helperText: Optional. Uses the default StorageClass when omitted, not the data disk's class. Cannot be changed once WAL storage exists.
                    label: WAL storage class
                  path: spec.components.engine.parameters.walStorage.storageClass
                  uiType: select
                  validation:
                    modes:
                      edit:
                        celExpressions:
                          - celExpr: '!has(original.spec.components.engine.parameters.walStorage.size) || (has(spec.components.engine.parameters.walStorage.storageClass) == has(original.spec.components.engine.parameters.walStorage.storageClass) && (!has(spec.components.engine.parameters.walStorage.storageClass) || spec.components.engine.parameters.walStorage.storageClass == original.spec.components.engine.parameters.walStorage.storageClass))'
                            message: WAL storage class cannot be changed once WAL storage exists
              componentsOrder:
                - size
                - storageClass
              description: Store WAL on a dedicated volume. Once configured, separate WAL storage cannot be disabled.
              groupType: toggleable
              label: Separate WAL storage
              uiType: group
          componentsOrder:
            - nodes
            - walStorage
            - synchronousReplication
          description: Configure the resources your new database will have access to.
          label: Resources details
      sectionsOrder:
        - databaseVersion
        - bootstrap
        - extensions
        - monitoring
        - resources
        - advanced
  versions:
    - components:
        engine: "17.10"
      name: "17.10"
    - components:
        engine: "18.4"
      name: "18.4"
    - components:
        engine: "16.14"
      name: "16.14"
    - components:
        engine: "15.18"
      name: "15.18"
    - components:
        engine: "14.23"
      name: "14.23"
