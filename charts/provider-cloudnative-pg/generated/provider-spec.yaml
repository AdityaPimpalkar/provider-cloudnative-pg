                owner:
                  fieldParams:
                    label: Database owner
                    modes:
                      edit:
                        disabled: true
                      restore:
                        disabled: true
                    placeholder: app
                  path: spec.components.engine.parameters.bootstrap.initdb.owner
                  uiType: text
                  validation:
                    celExpressions:
                      - celExpr: '!(has(spec.components.engine.parameters.bootstrap.initdb.owner) && spec.components.engine.parameters.bootstrap.initdb.owner != "") || (has(spec.components.engine.parameters.bootstrap.initdb.database) && spec.components.engine.parameters.bootstrap.initdb.database != "")'
