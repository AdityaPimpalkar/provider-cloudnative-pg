# Provider identity and component definitions.
# Edit this file to add or remove components.
# Run `make generate` after making changes.

components:
    engine:
        type: postgresql
        parametersSchema: CNPGCustomSpec
    proxy:
        type: pgbouncer
        parametersSchema: PgBouncerParameters
name: provider-cloudnative-pg
# Instances can be suspended: CloudNativePG hibernation stops the instances
# and keeps their volumes.
suspend: {}

# Component types: the kind of the software each type runs, published as
# Provider.spec.componentTypes.<type>.kind and matched by monitoring classes
# (OpenTelemetry db.system.name for databases). Version catalogs stay in
# versions.yaml. pgbouncer declares no kind until it publishes metrics.
componentTypes:
  postgresql:
    kind: postgresql
