---
# See more details at https://k3d.io/v5.3.0/usage/configfile/
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: provider-cloudnative-pg-dev
servers: 1
agents: 3
# Kubernetes 1.35+ with containerd 2.1+ for ImageVolume (image-volume extensions).
image: rancher/k3s:v1.36.5-k3s1
registries:
  create:
    name: k3d-provider-cloudnative-pg-registry
    host: "0.0.0.0"
    hostPort: "5005"
options:
  k3d:
    wait: true
    disableLoadbalancer: true
  k3s:
    extraArgs:
      - arg: "--disable=traefik,metrics-server,servicelb"
        nodeFilters:
          - server:*
      - arg: "--disable-network-policy"
        nodeFilters:
          - server:*
