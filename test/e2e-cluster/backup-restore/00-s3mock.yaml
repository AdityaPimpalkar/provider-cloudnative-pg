apiVersion: v1
kind: Secret
metadata:
  name: s3mock-credentials
type: Opaque
data:
  AWS_ACCESS_KEY_ID: c2FtcGxl
  AWS_SECRET_ACCESS_KEY: c2FtcGxl
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupStorage
metadata:
  name: s3mock-s3
spec:
  type: s3
  s3:
    bucket: backups
    region: us-east-1
    endpointURL: http://s3mock:9090
    forcePathStyle: true
    verifyTLS: false
    credentialsSecretRef:
      name: s3mock-credentials
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3mock
  template:
    metadata:
      labels:
        app: s3mock
    spec:
      containers:
        - name: s3mock
          image: adobe/s3mock:5.2.3
          env:
            - name: COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS
              value: backups
          ports:
            - name: s3
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /favicon.ico
              port: s3
            initialDelaySeconds: 4
            timeoutSeconds: 2
            periodSeconds: 3
            failureThreshold: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: s3mock
spec:
  selector:
    app: s3mock
  ports:
    - name: s3
      port: 9090
      targetPort: s3
