apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: pg-del
spec:
  providerRef:
    name: provider-cloudnative-pg
  version: "17.10"
  components:
    engine:
      type: postgresql
      replicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      storage:
        size: 1Gi
  backup:
    enabled: true
    classRef:
      name: cnpg-barman-plugin
    storages:
      - storageRef:
          name: s3mock-s3
        schedules:
          # Never fires during the test; it only carries the retention policy.
          - name: yearly
            enabled: true
            cron: "0 0 1 1 *"
            retention:
              type: time
              duration: 30d
