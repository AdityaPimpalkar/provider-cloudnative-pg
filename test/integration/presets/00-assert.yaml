apiVersion: core.openeverest.io/v1alpha1
kind: ClusterInstancePreset
metadata:
  name: postgresql-replicaset
  labels:
    app.kubernetes.io/component: preset
spec:
  providerRef:
    name: provider-cloudnative-pg
  version: "18.6"
  topology:
    type: replicaSet
  components:
    engine:
      type: postgresql
      replicas: 3
      storage:
        size: 25Gi
      parameters:
        requireTLS: true
