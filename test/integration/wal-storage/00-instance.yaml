apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: wal-test
spec:
  providerRef:
    name: provider-cloudnative-pg
  components:
    engine:
      type: postgresql
      replicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      storage:
        size: 2Gi
      parameters:
        walStorage:
          size: 1Gi
