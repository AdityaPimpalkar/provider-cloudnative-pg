apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: backup-test
spec:
  providerRef:
    name: provider-cloudnative-pg
  components:
    engine:
      type: postgresql
      replicas: 1
      resources:
        requests:
          cpu: "250m"
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      storage:
        size: 1Gi
  backup:
    enabled: true
    classRef:
      name: cnpg-barman-plugin
    storages:
      - storageRef:
          name: s3mock-s3
        schedules:
          - name: integration-retention
            enabled: true
            cron: "* * * * *"
            retention:
              type: time
              duration: 30d
