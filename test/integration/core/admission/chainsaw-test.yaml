# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: core-admission
spec:
  description: |
    The provider's admission webhook: it rejects an invalid Instance with the
    field path, admits it while the provider is down, blocks an update only on
    errors the stored Instance did not already have, and rejects turning off
    an extension that is created in the database.
  # Scales the provider down, which every other test depends on.
  concurrent: false
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,clusters.postgresql.cnpg.io -o yaml
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-cloudnative-pg
        tail: 100
  steps:
    - name: provider-ready
      try:
        - assert:
            file: 00-assert.yaml

    - name: reject-invalid
      try:
        - script:
            content: kubectl apply --dry-run=server -n $NAMESPACE -f 10-invalid-instance.yaml
            check:
              ($error != null): true
              (contains($stderr, 'spec.components[engine].parameters.postgresql.synchronous')): true
        - script:
            content: kubectl apply -n $NAMESPACE -f 10-invalid-instance.yaml
            check:
              ($error != null): true
              (contains($stderr, 'spec.components[engine].parameters.postgresql.synchronous')): true
        - error:
            file: 10-error.yaml

    - name: admit-while-provider-down
      try:
        - script:
            timeout: 1m
            content: |
              kubectl -n provider-system scale deployment/provider-cloudnative-pg --replicas=0
              while kubectl -n provider-system get pods -o name \
                -l app.kubernetes.io/name=provider-cloudnative-pg | grep -q .; do
                sleep 1
              done
        - apply:
            file: 10-invalid-instance.yaml
      finally:
        - script:
            timeout: 2m
            content: |
              kubectl -n provider-system scale deployment/provider-cloudnative-pg --replicas=1
              kubectl -n provider-system rollout status deployment/provider-cloudnative-pg --timeout=110s

    - name: report-once-back
      try:
        - assert:
            file: 20-assert.yaml

    - name: block-new-errors-only
      try:
        - script:
            timeout: 1m
            content: |
              # Writes are admitted until the webhook serves again.
              for i in $(seq 1 25); do
                kubectl apply --dry-run=server -n $NAMESPACE -f 30-new-error.yaml >/dev/null 2>&1 || break
                sleep 2
              done
              kubectl apply -n $NAMESPACE -f 30-new-error.yaml
            check:
              ($error != null): true
              (contains($stderr, 'spec.components[proxy]')): true
              (contains($stderr, 'spec.components[engine].parameters.postgresql.synchronous')): false
        - script:
            content: kubectl apply -n $NAMESPACE -f 31-unrelated-change.yaml
        - assert:
            file: 31-assert.yaml

    - name: fix
      try:
        - apply:
            file: 40-fixed-instance.yaml
        - assert:
            file: 40-assert.yaml

    - name: reject-disabling-an-extension
      try:
        - script:
            content: kubectl apply -n $NAMESPACE -f 50-disable-extension.yaml
            check:
              ($error != null): true
              (contains($stderr, 'spec.components[engine].parameters.extensions.pgvector.enabled')): true
              (contains($stderr, 'cannot be disabled once enabled')): true

    - name: delete-instance
      try:
        - script:
            content: kubectl -n $NAMESPACE delete instance/test-cnpg-admission --wait=false --ignore-not-found
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: test-cnpg-admission
            timeout: 2m
            for:
              deletion: {}
