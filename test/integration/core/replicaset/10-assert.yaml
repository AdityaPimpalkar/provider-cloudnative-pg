apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-cnpg-cluster
spec:
  providerRef:
    name: provider-cloudnative-pg
  components:
    engine:
      type: postgresql
      replicas: 3
      resources:
        requests:
          cpu: "1"
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 1Gi
      storage:
        size: 5Gi
      parameters:
        postgresql:
          parameters:
            max_connections: "100"
            shared_buffers: "128MB"
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: test-cnpg-cluster
spec:
  instances: 3
  imagePullPolicy: IfNotPresent
  (ends_with(imageName, '17.10-standard-trixie')): true
  inheritedMetadata:
    labels:
      core.openeverest.io/component: engine
      core.openeverest.io/instance: test-cnpg-cluster
      core.openeverest.io/provider: provider-cloudnative-pg
  affinity:
    nodeSelector:
      kubernetes.io/os: linux
    tolerations:
      - key: dedicated
        operator: Equal
        value: database
        effect: NoSchedule
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          cnpg.io/cluster: test-cnpg-cluster
          cnpg.io/podRole: instance
  storage:
    size: 5Gi
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 1Gi
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"
