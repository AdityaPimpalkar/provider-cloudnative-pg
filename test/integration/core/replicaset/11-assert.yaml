apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-cnpg-cluster
spec:
  providerRef:
    name: provider-cloudnative-pg
  components:
    engine:
      type: postgresql
      replicas: 3
      resources:
        requests:
          cpu: "1"
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 1Gi
      storage:
        size: 5Gi
      parameters:
        postgresql:
          parameters:
            max_connections: "100"
            shared_buffers: "128MB"
status:
  phase: Ready
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: test-cnpg-cluster
spec:
  instances: 3
  imagePullPolicy: IfNotPresent
  inheritedMetadata:
    labels:
      core.openeverest.io/component: engine
      core.openeverest.io/instance: test-cnpg-cluster
      core.openeverest.io/provider: provider-cloudnative-pg
  storage:
    size: 5Gi
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 1Gi
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"
status:
  instances: 3
  readyInstances: 3
