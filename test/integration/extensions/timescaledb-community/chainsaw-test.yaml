# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
# TimescaleDB Community (Timescale License) mounted as an image volume.
# Needs PostgreSQL 18.6+ and Kubernetes ImageVolume (1.35+, or 1.33/1.34 with
# the feature gate, and containerd 2.1+).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: extensions-timescaledb-community
spec:
  timeouts:
    assert: 10m
    cleanup: 3m
  steps:
    - name: create-instance
      try:
        - apply:
            file: 00-instance.yaml
        - assert:
            file: 00-assert.yaml
      catch:
        - script:
            content: kubectl get instance,cluster,database,pod -n $NAMESPACE -o wide
        - script:
            content: kubectl get instance/tsdb-community -n $NAMESPACE -o yaml
        - script:
            content: kubectl get database/tsdb-community-extensions -n $NAMESPACE -o yaml
        - script:
            content: kubectl describe pod -n $NAMESPACE -l cnpg.io/cluster=tsdb-community

    - name: use-tsl-features
      try:
        - script:
            timeout: 2m
            content: |
              set -e
              q() { kubectl exec -n "$NAMESPACE" tsdb-community-1 -c postgres -- psql -v ON_ERROR_STOP=1 -d app -tAc "$1"; }
              expect() { got="$(q "$1")"; [ "$got" = "$2" ] || { echo "query: $1"; echo "got: $got, want: $2"; exit 1; }; }

              expect "SHOW timescaledb.license" "timescale"

              # Compression, policies and continuous aggregates fail under the
              # Apache-2.0 edition. Run as the application owner (SET ROLE drops
              # superuser rights).
              kubectl exec -i -n "$NAMESPACE" tsdb-community-1 -c postgres -- psql -v ON_ERROR_STOP=1 -d app -q <<'SQL'
              SET ROLE app;
              CREATE TABLE metrics (time timestamptz NOT NULL, device int NOT NULL, value double precision);
              SELECT create_hypertable('metrics', by_range('time', INTERVAL '1 day'));
              INSERT INTO metrics
                SELECT t, d, random()
                FROM generate_series(now() - INTERVAL '3 days', now(), INTERVAL '1 hour') t, generate_series(1, 3) d;
              ALTER TABLE metrics SET (timescaledb.compress, timescaledb.compress_segmentby = 'device');
              SELECT compress_chunk(c) FROM show_chunks('metrics', older_than => INTERVAL '1 day') c;
              SELECT add_compression_policy('metrics', INTERVAL '7 days');
              CREATE MATERIALIZED VIEW metrics_hourly WITH (timescaledb.continuous) AS
                SELECT time_bucket(INTERVAL '1 hour', time) AS bucket, device, avg(value) AS avg_value
                FROM metrics GROUP BY bucket, device WITH NO DATA;
              CALL refresh_continuous_aggregate('metrics_hourly', NULL, NULL);
              SQL

              expect "SELECT count(*) > 0 FROM timescaledb_information.chunks WHERE hypertable_name = 'metrics' AND is_compressed" "t"
              expect "SELECT count(*) > 0 FROM metrics_hourly" "t"
