apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: ext-images
spec:
  providerRef:
    name: provider-cloudnative-pg
  version: "18.4"
  components:
    engine:
      type: postgresql
      replicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      storage:
        size: 1Gi
      parameters:
        extensions:
          timescaledb:
            enabled: true
          postgis:
            enabled: true
          pgrouting:
            enabled: true
          pgivm:
            enabled: true
          wal2json:
            enabled: true
          age:
            enabled: true
