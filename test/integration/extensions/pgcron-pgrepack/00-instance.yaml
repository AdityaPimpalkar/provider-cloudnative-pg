apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: ext-jobs
spec:
  providerRef:
    name: provider-cloudnative-pg
  version: "18.4"
  components:
    engine:
      type: postgresql
      replicas: 2
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      storage:
        size: 1Gi
      parameters:
        extensions:
          pgcron:
            enabled: true
          pgrepack:
            enabled: true
