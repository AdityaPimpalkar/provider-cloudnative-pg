apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: ext-jobs
status:
  phase: Ready
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ext-jobs
spec:
  postgresql:
    shared_preload_libraries:
      - pg_cron
    parameters:
      cron.database_name: app
      cron.use_background_workers: "on"
status:
  readyInstances: 2
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: ext-jobs-extensions
spec:
  name: app
  cluster:
    name: ext-jobs
  extensions:
    - name: pg_cron
    - name: pg_repack
status:
  applied: true
