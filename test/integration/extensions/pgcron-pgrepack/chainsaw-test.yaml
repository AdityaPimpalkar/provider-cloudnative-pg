# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
# pg_cron and pg_repack, mounted as image volumes from the provider's
# extensions catalog, on two instances so that pg_cron is checked across a
# switchover. Needs PostgreSQL 18 and Kubernetes ImageVolume (1.35+, or
# 1.33/1.34 with the feature gate, and containerd 2.1+).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: extensions-pgcron-pgrepack
spec:
  timeouts:
    assert: 10m
    cleanup: 3m
  steps:
    - name: create-instance
      try:
        - apply:
            file: 00-instance.yaml
        - assert:
            file: 00-assert.yaml
      catch:
        - script:
            content: kubectl get instance,cluster,database,pod -n $NAMESPACE -o wide
        - script:
            content: kubectl get instance/ext-jobs -n $NAMESPACE -o yaml
        - script:
            content: kubectl get database/ext-jobs-extensions -n $NAMESPACE -o yaml

    - name: schedule-job-as-owner
      try:
        - script:
            timeout: 2m
            content: |
              set -e
              primary="$(kubectl get cluster ext-jobs -n "$NAMESPACE" -o jsonpath='{.status.currentPrimary}')"
              # SET ROLE drops superuser rights, so the job is scheduled and run as app.
              kubectl exec -i -n "$NAMESPACE" "$primary" -c postgres -- psql -v ON_ERROR_STOP=1 -d app -q <<'SQL'
              SET ROLE app;
              CREATE TABLE ticks (t timestamptz NOT NULL DEFAULT now());
              SELECT cron.schedule('tick', '1 seconds', $$INSERT INTO ticks DEFAULT VALUES$$);
              SQL
              q() { kubectl exec -n "$NAMESPACE" "$primary" -c postgres -- psql -v ON_ERROR_STOP=1 -d app -tAc "$1"; }
              for i in $(seq 1 60); do
                [ "$(q "SELECT count(*) >= 3 FROM ticks")" = "t" ] && break
                sleep 1
              done
              [ "$(q "SELECT count(*) >= 3 FROM ticks")" = "t" ] || { q "SELECT * FROM cron.job_run_details"; exit 1; }
              [ "$(q "SELECT count(*) > 0 FROM cron.job_run_details WHERE status = 'succeeded' AND username = 'app'")" = "t" ]

    - name: repack-table
      try:
        - script:
            timeout: 2m
            content: |
              set -e
              primary="$(kubectl get cluster ext-jobs -n "$NAMESPACE" -o jsonpath='{.status.currentPrimary}')"
              q() { kubectl exec -n "$NAMESPACE" "$primary" -c postgres -- psql -v ON_ERROR_STOP=1 -d app -tAc "$1"; }
              q "CREATE TABLE bloated (id int PRIMARY KEY, payload text)"
              q "INSERT INTO bloated SELECT i, repeat('x', 200) FROM generate_series(1, 20000) i"
              q "DELETE FROM bloated WHERE id % 2 = 0"
              before="$(q "SELECT pg_relation_filenode('bloated')")"
              kubectl exec -n "$NAMESPACE" "$primary" -c postgres -- \
                /extensions/pg-repack/bin/pg_repack --dbname=app --table=public.bloated
              after="$(q "SELECT pg_relation_filenode('bloated')")"
              [ "$before" != "$after" ] || { echo "pg_repack did not rewrite the table"; exit 1; }
              [ "$(q "SELECT count(*) FROM bloated")" = "10000" ]

    - name: jobs-resume-after-switchover
      try:
        - script:
            timeout: 5m
            content: |
              set -e
              old="$(kubectl get cluster ext-jobs -n "$NAMESPACE" -o jsonpath='{.status.currentPrimary}')"
              new="$(kubectl get pod -n "$NAMESPACE" -l cnpg.io/cluster=ext-jobs,cnpg.io/instanceRole=replica -o jsonpath='{.items[0].metadata.name}')"
              # What "kubectl cnpg promote" does
              kubectl patch cluster ext-jobs -n "$NAMESPACE" --subresource=status --type=merge \
                -p "{\"status\":{\"targetPrimary\":\"$new\"}}"
              for i in $(seq 1 120); do
                [ "$(kubectl get cluster ext-jobs -n "$NAMESPACE" -o jsonpath='{.status.currentPrimary}')" = "$new" ] && break
                sleep 2
              done
              [ "$(kubectl get cluster ext-jobs -n "$NAMESPACE" -o jsonpath='{.status.currentPrimary}')" = "$new" ]
              q() { kubectl exec -n "$NAMESPACE" "$new" -c postgres -- psql -v ON_ERROR_STOP=1 -d app -tAc "$1"; }
              for i in $(seq 1 120); do
                [ "$(q "SELECT pg_is_in_recovery()" 2>/dev/null)" = "f" ] && break
                sleep 1
              done
              # The old primary is demoted, so ticks after the promotion come from the new one.
              promoted="$(q "SELECT now()")"
              for i in $(seq 1 90); do
                [ "$(q "SELECT count(*) >= 3 FROM ticks WHERE t > '$promoted'")" = "t" ] && break
                sleep 1
              done
              [ "$(q "SELECT count(*) >= 3 FROM ticks WHERE t > '$promoted'")" = "t" ] || {
                echo "no ticks on the new primary $new since $promoted"
                q "SELECT * FROM cron.job_run_details ORDER BY start_time DESC LIMIT 5"
                exit 1
              }
              echo "pg_cron moved from $old to $new"
      catch:
        - script:
            content: kubectl get cluster/ext-jobs -n $NAMESPACE -o yaml
