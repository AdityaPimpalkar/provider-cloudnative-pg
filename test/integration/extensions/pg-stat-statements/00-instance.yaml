# No extensions set: pg_stat_statements is on by default for a new instance.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: ext-pgss
spec:
  providerRef:
    name: provider-cloudnative-pg
  version: "14.23"
  components:
    engine:
      type: postgresql
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      storage:
        size: 1Gi
