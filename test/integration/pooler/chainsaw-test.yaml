# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
# The proxy component becomes a CloudNativePG Pooler (type rw). Clients connect
# through its Service, which the operator names after the Pooler.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pooler
spec:
  timeouts:
    cleanup: 3m
  steps:
    - name: create-instance
      try:
        - apply:
            file: 00-instance.yaml
        - script:
            timeout: 6m
            content: |
              set -eu
              kubectl wait --for=create cluster/pooled -n "$NAMESPACE" --timeout=60s
              kubectl wait --for=condition=Ready cluster/pooled -n "$NAMESPACE" --timeout=300s
              kubectl wait --for=create pooler/pooled-pooler -n "$NAMESPACE" --timeout=60s
              kubectl wait --for=jsonpath='{.status.phase}'=active pooler/pooled-pooler -n "$NAMESPACE" --timeout=180s
              kubectl wait --for=condition=Available deployment/pooled-pooler -n "$NAMESPACE" --timeout=180s
      catch:
        - script:
            content: kubectl get instance,cluster,pooler,deploy,pod -n "$NAMESPACE" -o wide
        - script:
            content: kubectl get pooler/pooled-pooler -n "$NAMESPACE" -o yaml

    - name: connect-through-pooler
      try:
        - script:
            timeout: 3m
            content: |
              set -eu
              test "$(kubectl get pooler pooled-pooler -n "$NAMESPACE" -o jsonpath='{.spec.type}')" = rw
              test "$(kubectl get pooler pooled-pooler -n "$NAMESPACE" -o jsonpath='{.spec.cluster.name}')" = pooled
              test "$(kubectl get pooler pooled-pooler -n "$NAMESPACE" -o jsonpath='{.spec.pgbouncer.poolMode}')" = transaction
              test "$(kubectl get pooler pooled-pooler -n "$NAMESPACE" -o jsonpath='{.spec.instances}')" = 1
              test "$(kubectl get pooler pooled-pooler -n "$NAMESPACE" -o jsonpath='{.spec.template.spec.containers[0].name}')" = pgbouncer
              test "$(kubectl get pooler pooled-pooler -n "$NAMESPACE" -o jsonpath='{.spec.template.spec.containers[0].resources.requests.cpu}')" = 100m

              kubectl wait --for=jsonpath='{.status.phase}'=Ready instance/pooled -n "$NAMESPACE" --timeout=120s
              secret="$(kubectl get instance pooled -n "$NAMESPACE" -o jsonpath='{.status.connectionSecretRef.name}')"
              host="$(kubectl get secret "$secret" -n "$NAMESPACE" -o jsonpath='{.data.host}' | base64 -d)"
              test "$host" = "pooled-pooler.$NAMESPACE.svc"
              uri="$(kubectl get secret "$secret" -n "$NAMESPACE" -o jsonpath='{.data.uri}' | base64 -d)"
              case "$uri" in *"@pooled-pooler.$NAMESPACE.svc:5432/app?sslmode=require") ;; *) echo "unexpected uri host/port"; exit 1 ;; esac
              password="$(kubectl get secret pooled-app -n "$NAMESPACE" -o jsonpath='{.data.password}' | base64 -d)"
              ips="$(kubectl get pods -n "$NAMESPACE" -l cnpg.io/poolerName=pooled-pooler -o jsonpath='{range .items[*]}{.status.podIP}{"\n"}{end}')"
              test -n "$ips"
              # requireTLS also applies at the pooler (client_tls_sslmode=require).
              test "$(kubectl get pooler pooled-pooler -n "$NAMESPACE" -o jsonpath='{.spec.pgbouncer.parameters.client_tls_sslmode}')" = require
              for _ in $(seq 1 30); do
                plain="$(kubectl exec -n "$NAMESPACE" pooled-1 -c postgres -- env PGPASSWORD="$password" \
                  psql "host=pooled-pooler user=app dbname=app sslmode=disable" -tAc 'SELECT 1' 2>&1 || true)"
                case "$plain" in *"SSL required"*) break ;; esac
                sleep 2
              done
              echo "sslmode=disable through the pooler: $plain"
              case "$plain" in *"SSL required"*) ;; *) exit 1 ;; esac
              for _ in $(seq 1 30); do
                client="$(kubectl exec -n "$NAMESPACE" pooled-1 -c postgres -- \
                  psql "$uri" \
                  -tAc "SELECT client_addr::text FROM pg_stat_activity WHERE pid = pg_backend_pid()" 2>/dev/null || true)"
                client="$(printf '%s' "$client" | tr -d '[:space:]')"
                if [ -n "$client" ] && printf '%s\n' "$ips" | grep -qx "$client"; then
                  echo "backend client_addr $client is a PgBouncer pod"
                  exit 0
                fi
                echo "waiting for a connection through the pooler (client_addr=${client:-none})"
                sleep 2
              done
              echo "pooler pod IPs: $ips"
              exit 1
      catch:
        - script:
            content: kubectl get instance/pooled -n "$NAMESPACE" -o yaml
        - script:
            content: kubectl get pooler,deploy,pod -n "$NAMESPACE" -l cnpg.io/poolerName=pooled-pooler -o yaml

    - name: remove-proxy
      try:
        - script:
            timeout: 3m
            content: |
              set -eu
              kubectl patch instance/pooled -n "$NAMESPACE" --type=json \
                -p '[{"op":"remove","path":"/spec/components/proxy"}]'
              kubectl wait --for=delete pooler/pooled-pooler -n "$NAMESPACE" --timeout=120s
              secret="$(kubectl get instance pooled -n "$NAMESPACE" -o jsonpath='{.status.connectionSecretRef.name}')"
              for _ in $(seq 1 30); do
                host="$(kubectl get secret "$secret" -n "$NAMESPACE" -o jsonpath='{.data.host}' | base64 -d)"
                [ "$host" = "pooled-rw.$NAMESPACE.svc" ] && break
                sleep 2
              done
              echo "host after removing the proxy: $host"
              test "$host" = "pooled-rw.$NAMESPACE.svc"
              kubectl wait --for=jsonpath='{.status.phase}'=Ready instance/pooled -n "$NAMESPACE" --timeout=60s
      catch:
        - script:
            content: kubectl get instance/pooled -n "$NAMESPACE" -o yaml
        - script:
            content: kubectl get pooler,deploy -n "$NAMESPACE"
