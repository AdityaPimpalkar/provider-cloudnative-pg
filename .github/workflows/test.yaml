name: Integration Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMG: provider-cloudnative-pg:ci

jobs:
  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install k3d
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d version

      - name: Install chainsaw
        env:
          CHAINSAW_VERSION: v0.2.15
        run: |
          curl -sLo /tmp/chainsaw.tar.gz "https://github.com/kyverno/chainsaw/releases/download/${CHAINSAW_VERSION}/chainsaw_linux_amd64.tar.gz"
          tar -xzf /tmp/chainsaw.tar.gz -C /tmp
          sudo install -m 0755 /tmp/chainsaw /usr/local/bin/chainsaw
          chainsaw version

      - name: Create k3d cluster
        run: |
          sudo modprobe br_netfilter
          make k3d-cluster-up

      - name: Build provider image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Import image into k3d
        run: make load-image

      - name: Install OpenEverest CRDs
        run: make install-crds

      - name: Deploy provider
        run: make deploy-provider-ci

      - name: Wait for provider
        run: |
          kubectl wait --for=condition=Available -n provider-system \
            deploy --all --timeout=5m
          kubectl get provider provider-cloudnative-pg

      - name: Run integration tests
        run: make test-integration

      - name: Debug cluster on failure
        if: failure()
        run: |
          kubectl get provider,instance,cluster,pod -A || true
          kubectl describe pods -n provider-system || true
          kubectl logs -n provider-system --all-containers --tail=200 -l app.kubernetes.io/name=provider-cloudnative-pg || true

      - name: Upload chainsaw report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chainsaw-report-${{ github.run_id }}
          path: /tmp/chainsaw-report.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        run: make k3d-cluster-down
