name: Integration Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMG: provider-cloudnative-pg:ci

jobs:
  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Install k3d
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d version

      - name: Install chainsaw
        env:
          CHAINSAW_VERSION: v0.2.15
        run: |
          curl -sLo /tmp/chainsaw.tar.gz "https://github.com/kyverno/chainsaw/releases/download/${CHAINSAW_VERSION}/chainsaw_linux_amd64.tar.gz"
          tar -xzf /tmp/chainsaw.tar.gz -C /tmp
          sudo install -m 0755 /tmp/chainsaw /usr/local/bin/chainsaw
          chainsaw version

      - name: Create k3d cluster
        run: |
          sudo modprobe br_netfilter
          make k3d-cluster-up

      - name: Build provider image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Import image into k3d
        run: make load-image

      - name: Install OpenEverest CRDs
        run: make install-openeverest-crds

      - name: Install Barman plugin
        run: |
          HELM_NAMESPACE=provider-system make install-barman-plugin
          kubectl wait --for=condition=Established crd/objectstores.barmancloud.cnpg.io --timeout=2m

      - name: Install BackupClasses
        run: make install-backupclasses

      - name: Deploy provider
        run: make deploy-provider-ci

      - name: Wait for provider
        run: |
          kubectl wait --for=condition=Available -n provider-system \
            deploy/provider-cloudnative-pg deploy/cnpg-operator --timeout=5m
          kubectl get provider provider-cloudnative-pg

      - name: Run integration tests
        run: make test-integration

      - name: Debug cluster on failure
        if: failure()
        run: |
          kubectl get provider,instance,cluster,pod -A || true
          kubectl describe pods -n provider-system || true
          kubectl logs -n provider-system --all-containers --tail=200 -l app.kubernetes.io/name=provider-cloudnative-pg || true
          kubectl get crd | grep -E 'cnpg|openeverest|barman' || true

      - name: Upload chainsaw report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chainsaw-report-${{ github.run_id }}
          path: /tmp/chainsaw-report.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        run: make k3d-cluster-down
