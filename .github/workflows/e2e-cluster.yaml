# E2E cluster tests: chainsaw suites under test/e2e-cluster run against the
# released OpenEverest core (server and controller, version from go.mod) and
# this provider built from source, on a k3d cluster.
name: E2E Cluster Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-cluster:
    name: E2E Cluster Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up platform
        uses: ./.github/actions/e2e-platform

      - name: Install chainsaw
        env:
          CHAINSAW_VERSION: v0.2.15
        run: |
          curl -sLo /tmp/chainsaw.tar.gz "https://github.com/kyverno/chainsaw/releases/download/${CHAINSAW_VERSION}/chainsaw_linux_amd64.tar.gz"
          tar -xzf /tmp/chainsaw.tar.gz -C /tmp
          sudo install -m 0755 /tmp/chainsaw /usr/local/bin/chainsaw

      - name: Run e2e-cluster tests
        run: make test-e2e-cluster

      - name: Check OpenEverest stayed healthy
        run: make check-openeverest-restarts

      - name: Debug cluster on failure
        if: failure()
        run: |
          kubectl get provider,instance,cluster,backups.backup.openeverest.io,restores.backup.openeverest.io,pod -A || true
          # Namespaces left Terminating by a chainsaw cleanup timeout: what still holds them.
          for ns in $(kubectl get ns --no-headers | awk '$2 == "Terminating" {print $1}'); do
            echo "=== Terminating namespace $ns"
            kubectl get ns "$ns" -o jsonpath='{range .status.conditions[*]}{.type}={.status}: {.message}{"\n"}{end}' || true
            kubectl api-resources --verbs=list --namespaced -o name | grep -v '^events' \
              | xargs -I{} kubectl get {} -n "$ns" --ignore-not-found -o custom-columns=KIND:.kind,NAME:.metadata.name,DELETING:.metadata.deletionTimestamp,FINALIZERS:.metadata.finalizers --no-headers || true
            for pod in $(kubectl get pods -n "$ns" -o name 2>/dev/null); do
              kubectl logs -n "$ns" "$pod" --all-containers --tail=50 || true
            done
          done
          kubectl logs -n everest-system deploy/everest-controller --tail=200 || true
          kubectl logs -n everest-system deploy/everest-controller --previous --tail=100 || true
          kubectl logs -n provider-system --all-containers --tail=300 -l app.kubernetes.io/name=provider-cloudnative-pg || true

      - name: Upload chainsaw report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chainsaw-report-e2e-cluster-${{ github.run_id }}
          path: /tmp/chainsaw-report-e2e-cluster.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        run: make k3d-cluster-down
