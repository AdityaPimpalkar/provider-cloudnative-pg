name: E2E platform
description: >-
  Create a k3d cluster with the released OpenEverest core (version from go.mod),
  the CloudNativePG operator, the Barman Cloud Plugin, this provider built from
  the checked-out source, and its BackupClass.

inputs:
  image:
    description: Provider image tag to build and import into k3d.
    required: false
    default: provider-cloudnative-pg:ci

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod

    - name: Set up Helm
      uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

    - name: Set up kubectl
      uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Install k3d
      shell: bash
      run: |
        curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
        k3d version

    - name: Create k3d cluster
      shell: bash
      run: |
        sudo modprobe br_netfilter
        make k3d-cluster-up

    - name: Build provider image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: .
        push: false
        load: true
        tags: ${{ inputs.image }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Import provider image into k3d
      shell: bash
      # k3d image import can fail on some nodes yet exit 0 (its shared tarball
      # disappears); the provider uses pullPolicy Never, so retry until every
      # node has the image.
      run: |
        ref="docker.io/library/${{ inputs.image }}"
        for attempt in 1 2 3; do
          make load-image IMG=${{ inputs.image }} || true
          missing=""
          for node in $(k3d node list --no-headers | awk '$2 == "server" || $2 == "agent" {print $1}'); do
            docker exec "$node" crictl inspecti "$ref" >/dev/null 2>&1 || missing="$missing $node"
          done
          [ -z "$missing" ] && exit 0
          echo "attempt $attempt: image missing on$missing"
        done
        exit 1

    - name: Install OpenEverest core
      shell: bash
      run: make install-openeverest

    - name: Install Barman plugin
      shell: bash
      run: |
        HELM_NAMESPACE=provider-system make install-barman-plugin
        kubectl wait --for=condition=Established crd/objectstores.barmancloud.cnpg.io --timeout=2m

    - name: Deploy provider
      shell: bash
      run: make deploy-provider-ci IMG=${{ inputs.image }}

    - name: Install BackupClasses
      shell: bash
      run: make install-backupclasses

    - name: Wait for platform
      shell: bash
      run: |
        kubectl wait --for=condition=Available -n everest-system deploy --all --timeout=5m
        kubectl wait --for=condition=Available -n provider-system \
          deploy/provider-cloudnative-pg deploy/cnpg-operator --timeout=5m
        kubectl get provider provider-cloudnative-pg
        kubectl get backupclass cnpg-barman-plugin
        # Deployments report Available before a crash loop starts. Let them
        # settle, require every OpenEverest pod to be Ready, and record the
        # restart count; an occasional restart while starting up is harmless.
        # The workflows fail after their tests if anything restarted since,
        # since a crash-looping controller can take minutes to restart again.
        sleep 45
        make record-openeverest-restarts
